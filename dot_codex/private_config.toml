model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
model_verbosity = "medium"
file_opener = "none"
show_raw_agent_reasoning = true
sandbox_mode = "workspace-write"
approval_policy = "on-request"
personality = "pragmatic"
service_tier = "fast"
web_search = "live"
plan_mode_reasoning_effort = "xhigh"
suppress_unstable_features_warning = true
approvals_reviewer = "auto_review"

notify = ["/Users/npratt/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true

[projects."/Users/npratt/git/kueue"]
trust_level = "trusted"

[projects."/Users/npratt/git/aviato-client"]
trust_level = "trusted"

[projects."/Users/npratt/git/docs"]
trust_level = "trusted"

[projects."/Users/npratt/git/cwic"]
trust_level = "trusted"

[projects."/Users/npratt/git/aviato"]
trust_level = "trusted"

[projects."/Users/npratt/.codex"]
trust_level = "trusted"

[projects."/Users/npratt/git/dotfiles"]
trust_level = "trusted"

[projects."/Users/npratt/git"]
trust_level = "trusted"

[projects."/Users/npratt/git/kynes"]
trust_level = "trusted"

[projects."/Users/npratt/git/vllm"]
trust_level = "trusted"

[projects."/Users/npratt/git/appliedtraining"]
trust_level = "trusted"

[projects."/Users/npratt/git/llm-optimizations"]
trust_level = "trusted"

[projects."/Users/npratt/git/cross-agent-mcp"]
trust_level = "trusted"

[projects."/Users/npratt/git/harbor"]
trust_level = "trusted"

[projects."/Users/npratt/git/harbor-datasets"]
trust_level = "trusted"

[mcp_servers.slack]
url = "http://127.0.0.1:3003/mcp"
bearer_token_env_var = "SLACK_MCP_API_KEY"

[mcp_servers.cross-agent]
command = "uvx"
args = ["--from", "git+https://github.com/NavarrePratt/cross-agent-mcp[claude]", "cross-agent-mcp"]
tool_timeout_sec = 1200.0
env_vars = ["WANDB_API_KEY", "WANDB_INFERENCE_PROJECT"]

[mcp_servers.cross-agent.env]
CROSS_AGENT_OPENCODE_AGENT = "cross-agent-readonly"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."kynes-guide@cw-claude-code-plugins"]
enabled = true

[features]
terminal_resize_reflow = true
memories = true
prevent_idle_sleep = true
goals = true
default_mode_request_user_input = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

[marketplaces.cw-claude-code-plugins]
source_type = "git"
source = "https://github.com/coreweave/agent-plugins.git"
ref = "main"

[agents]
max_concurrent_threads_per_session = 50
